[project]
project_id = "agfvwyycgqhzjbywyzqi"

# ─── Edge Function JWT verification settings ──────────────────────────────────
# admin-users verifies JWTs internally for every action except public password recovery.

[functions.admin-users]
verify_jwt = false

[functions.invite-user]
verify_jwt = true

[functions.migrate-users]
verify_jwt = true

[functions.complete-activation]
verify_jwt = true

# ── Intentional exceptions (with documented reason) ──────────────────────────

# login-bridge: Called before auth session exists (user is logging in).
# Identity is verified internally by looking up username+password in app_users.
[functions.login-bridge]
verify_jwt = false

# telegram-bot: Called by Telegram webhook server (no Supabase JWT).
# Identity verified via TELEGRAM_WEBHOOK_SECRET HMAC signature check.
[functions.telegram-bot]
verify_jwt = false

# verify-email: Called by unauthenticated users clicking an email link.
# Token is validated internally against a time-limited one-time code.
[functions.verify-email]
verify_jwt = false

# daily-report & critical-alerts: Scheduled via pg_cron + pg_net without user JWT.
# Caller identity is strictly verified internally via SUPABASE_SERVICE_ROLE_KEY or CRON_WEBHOOK_SECRET.
[functions.daily-report]
verify_jwt = false

[functions.critical-alerts]
verify_jwt = false
