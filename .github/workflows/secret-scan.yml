name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff scanning

      - name: Detect hardcoded secrets in source files
        run: |
          # Patterns that indicate real secrets (not placeholders)
          PATTERNS=(
            'AIza[0-9A-Za-z_-]{35}'
            'sk-[A-Za-z0-9]{20,}'
            'SMTP_PASS\s*=\s*[A-Za-z0-9]{10,}'
            'BOT.*TOKEN\s*=\s*[0-9]+:[A-Za-z0-9_-]{35}'
            'TELEGRAM_BOT_TOKEN\s*=\s*[0-9]+:[A-Za-z0-9_-]+'
          )

          # Files to scan (exclude env files themselves and node_modules/dist)
          SCAN_DIRS="src supabase/functions scripts docs"

          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
              --include="*.jsx" --include="*.json" \
              -E "$PATTERN" $SCAN_DIRS 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "SECURITY ERROR: Potential secret found matching pattern: $PATTERN"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Secret scan FAILED. Remove hardcoded secrets and use environment variables instead."
            exit 1
          fi

          echo "✅ Secret scan passed — no hardcoded secrets detected."
